<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 성공</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        h1 { color: #28a745; }
        .info { margin: 10px 0; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>결제 성공!</h1>
        <div class="info"><strong>paymentKey:</strong> <span>{{ payment_key }}</span></div>
        <div class="info"><strong>orderId:</strong> <span>{{ order_id }}</span></div>
        <div class="info"><strong>amount:</strong> <span>{{ amount }}</span></div>
        <hr>
        <p><a href="/">다시 결제하기</a></p>
    </div>
</body>
</html>
