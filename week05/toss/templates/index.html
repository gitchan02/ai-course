<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스페이먼츠 테스트 결제</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        #payment-container { width: 100%; max-width: 400px; border: 1px solid #eee; padding: 20px; border-radius: 8px; }
        #payment-button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 16px; }
        #payment-button:disabled { background-color: #ccc; cursor: not-allowed; }
        #payment-method, #agreement { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="payment-container">
        <h2>테스트 상품 결제</h2>
        <div id="payment-method"></div>
        <div id="agreement"></div>
        <button id="payment-button" disabled>결제하기</button>
    </div>

    <script src="https://js.tosspayments.com/v2/standard"></script>
    <script>
        const clientKey = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
        const customerKey = TossPayments.ANONYMOUS;

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey });

        // 1. 금액 설정
        widgets.setAmount({
            currency: 'KRW',
            value: 1000,
        });

        // 2. 결제수단 렌더링
        widgets.renderPaymentMethods({
            selector: '#payment-method',
        });

        // 3. 약관 렌더링
        widgets.renderAgreement({
            selector: '#agreement',
            variantKey: 'AGREEMENT',
        }).then((agreementWidget) => {
            agreementWidget.on('agreementStatusChange', (agreementStatus) => {
                const button = document.getElementById('payment-button');
                button.disabled = !agreementStatus.agreedRequiredTerms;
            });
        });

        // 4. 결제 요청
        document.getElementById('payment-button').addEventListener('click', async () => {
            const orderId = Math.random().toString(36).substring(2, 15);
            const orderName = '테스트 상품';
            
            try {
                await widgets.requestPayment({
                    orderId,
                    orderName,
                    successUrl: window.location.origin + '/success',
                    failUrl: window.location.origin + '/fail',
                });
            } catch (error) {
                console.error('Payment failed:', error);
            }
        });
    </script>
</body>
</html>
