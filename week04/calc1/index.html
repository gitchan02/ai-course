<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>계산기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator" aria-label="계산기">
      <header class="calculator__header">
        <div>
          <p class="eyebrow">everyday math</p>
          <h1>계산기</h1>
        </div>
        <span class="status-dot" aria-label="작동 중"></span>
      </header>

      <section class="display" aria-live="polite">
        <p class="display__expression" id="expression"></p>
        <output class="display__value" id="display">0</output>
      </section>

      <section class="keypad" aria-label="계산기 버튼">
        <button class="key key--utility" data-action="clear">AC</button>
        <button class="key key--utility" data-action="backspace" aria-label="한 글자 지우기">⌫</button>
        <button class="key key--operator" data-value="%">%</button>
        <button class="key key--operator" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key--operator" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key--operator" data-value="−">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key--operator" data-value="+">+</button>

        <button class="key key--zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key--equals" data-action="equals">=</button>
      </section>
      <p class="hint">키보드로도 입력할 수 있어요</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
